name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  actions: read

env:
  # Frozen v0.5.0 vectors are under previous_versions/ starting at spec tag v0.6.0
  # (tag v0.5.0 still has them at root test_vectors/ only).
  SPEC_REPO_REF: v0.6.0

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout canonical spec vectors
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: GRIFORTIS/durashare
          ref: ${{ env.SPEC_REPO_REF }}
          path: durashare

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure CodeQL workflow is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/${{ github.repository }}/actions/workflows/codeql.yml" --jq .state)"
          echo "CodeQL workflow state: ${state}"
          if [ "${state}" != "active" ]; then
            echo "::error::CodeQL workflow is '${state}' (expected active). Re-enable with: gh workflow enable codeql.yml"
            exit 1
          fi

      - name: Run linter (tests + extracted durashare.html scripts)
        run: npm run lint

      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:ci
        env:
          DURASHARE_SPEC_REPO_PATH: ${{ github.workspace }}/durashare

      - name: Upload Playwright report
        if: always()
        id: upload_playwright_report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Retry upload Playwright report (once)
        if: always() && steps.upload_playwright_report.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: failure()
        id: upload_test_results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7

      - name: Retry upload test artifacts (once)
        if: failure() && steps.upload_test_results.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7

  ci-gate:
    name: CI Gate
    if: always()
    needs: [secret-scan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful security scan and test matrix
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "${SECRET_SCAN_RESULT}" != "success" ] || [ "${TEST_RESULT}" != "success" ]; then
            echo "Required CI job failed: secret-scan=${SECRET_SCAN_RESULT}, test=${TEST_RESULT}" >&2
            exit 1
          fi
