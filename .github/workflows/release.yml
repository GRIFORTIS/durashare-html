name: Release Verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g., v0.4.1)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  # Need a tag that contains previous_versions/v0.5.0/ (first present at v0.6.0).
  SPEC_REPO_REF: v0.6.0

jobs:
  verify:
    name: Verify published release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Missing tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          path: release-tree

      - name: Checkout verify tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: verify-tools

      - name: Verify version alignment (strict)
        working-directory: release-tree
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_NORM="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$TAG_NORM" ]; then
            echo "Tag/package.json mismatch: tag=$TAG_NAME package=$TAG_NORM" >&2
            exit 1
          fi
          if ! grep -Fq "$TAG_NORM" durashare.html; then
            echo "durashare.html missing user-facing version ${TAG_NORM}" >&2
            exit 1
          fi
          echo "OK: ${TAG_NAME}"

      - name: Import GRIFORTIS public key
        working-directory: release-tree
        run: gpg --batch --import GRIFORTIS-PGP-PUBLIC-KEY.asc

      - name: Verify signed git tag (OpenPGP only)
        working-directory: release-tree
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git cat-file tag "$TAG_NAME" | grep -q 'BEGIN SSH SIGNATURE'; then
            echo "Tag is SSH-signed. Releases require an OpenPGP tag from GRIFORTIS <security@grifortis.com>." >&2
            exit 1
          fi
          git -c gpg.ssh.allowedSignersFile=/dev/null tag -v "$TAG_NAME"

      - name: Verify release assets, signatures, and CI gates
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ROOT: ${{ github.workspace }}/release-tree
        run: bash verify-tools/.github/scripts/verify-published-release.sh

      - name: Checkout canonical spec vectors
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GRIFORTIS/durashare
          ref: ${{ env.SPEC_REPO_REF }}
          path: durashare

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: release-tree/package-lock.json

      - name: Install dependencies
        working-directory: release-tree
        run: npm ci

      - name: Install Playwright browsers
        working-directory: release-tree
        run: npx playwright install --with-deps chromium

      - name: Re-run conformance tests on release tag
        working-directory: release-tree
        run: npm run test:ci
        env:
          DURASHARE_SPEC_REPO_PATH: ${{ github.workspace }}/durashare
