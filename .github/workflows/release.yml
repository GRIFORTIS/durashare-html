name: Release Verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g., v0.4.1)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  SPEC_REPO_REF: v0.4.1

jobs:
  verify:
    name: Verify published release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Missing tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify version alignment (strict)
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_NORM="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$TAG_NORM" ]; then
            echo "Tag/package.json mismatch: tag=$TAG_NAME package=$TAG_NORM" >&2
            exit 1
          fi
          if ! grep -Fq "$TAG_NORM" schiavinato_sharing.html; then
            echo "schiavinato_sharing.html missing user-facing version ${TAG_NORM}" >&2
            exit 1
          fi
          echo "OK: ${TAG_NAME}"

      - name: Import GRIFORTIS public key
        run: gpg --batch --import GRIFORTIS-PGP-PUBLIC-KEY.asc

      - name: Verify signed git tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          git tag -v "$TAG_NAME"

      - name: Verify release assets, signatures, and CI gates
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/verify-published-release.sh

      - name: Checkout canonical spec vectors
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: GRIFORTIS/schiavinato-sharing
          ref: ${{ env.SPEC_REPO_REF }}
          path: schiavinato-sharing

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Re-run conformance tests on release tag
        run: npm run test:ci
        env:
          SCHIAVINATO_SHARING_SPEC_REPO_PATH: ${{ github.workspace }}/schiavinato-sharing
