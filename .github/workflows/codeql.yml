name: CodeQL Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly; also keeps the workflow from going idle-only if PRs are rare.
    # If GitHub sets state=disabled_inactivity, CI fails until: gh workflow enable codeql.yml
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2b983b380ce715a6c836c917154509c332c19b3a # v3
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2b983b380ce715a6c836c917154509c332c19b3a # v3
        with:
          category: "/language:javascript"

