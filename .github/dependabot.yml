version: 2
updates:
  # Keep npm dependency updates small and reviewable.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"

  # Keep third-party GitHub Actions current while preserving SHA pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
